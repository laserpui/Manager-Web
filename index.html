<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5ffff">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('manager-web-theme') === 'dark' ? 'dark' : 'light'; } catch (_) { document.documentElement.dataset.theme = 'light'; }</script>
  <title>Manager Web | Laser Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="เมนูเว็บ">
      <div class="brand"><div class="brand-mark" aria-hidden="true">L</div><div><strong>Manager Web</strong><small>LASER ENGINEER</small></div></div>
      <nav class="nav" id="nav" aria-label="เลือกเว็บไซต์"></nav>
      <div class="sidebar-bottom">
        <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true"><svg class="theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="theme-moon" viewBox="0 0 24 24"><path d="M20 15.4A8 8 0 0 1 8.6 4 8.2 8.2 0 1 0 20 15.4z"/></svg></span>
          <span class="theme-copy"><strong>รูปแบบหน้าจอ</strong><small id="themeToggleLabel">โหมดสว่าง</small></span>
          <span class="theme-switch" aria-hidden="true"><i></i></span>
        </button>
      </div>
    </aside>
    <button class="scrim" id="scrim" type="button" aria-label="ปิดเมนู"></button>
    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="ปิดเมนู" aria-controls="sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="heading"><span class="eyebrow">Laser Engineer / Manager Web</span><h1 id="pageTitle">หน้ารวมระบบงาน</h1></div>
        <a class="top-action" id="openFull" href="#" target="_blank" rel="noopener" hidden aria-label="เปิดหน้านี้ในแท็บใหม่"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5h6v6M19 5l-9 9"/><path d="M19 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg><span class="action-text">เปิดเต็มหน้า</span></a>
      </header>
      <div class="content">
        <section class="home" id="home"><div class="home-inner"><div class="intro"><span class="kicker">LASER ENGINEER WORKSPACE</span><h2>ข้อมูลทุกระบบ<br>ในหน้าจอเดียว</h2><div class="summary" aria-label="ภาพรวมระบบ"><span>5 ระบบงาน</span><span>4 ระบบดูข้อมูล</span><span>1 ระบบทำรายการ</span></div></div><div class="section-heading"><h2 class="section-title">เลือกเว็บไซต์</h2><span class="section-count">ทั้งหมด 5 ระบบ</span></div><div class="cards" id="cards"></div></div></section>
        <iframe class="viewer" id="viewer" title="เว็บไซต์ที่เลือก" hidden></iframe>
      </div>
    </main>
  </div>
  <script>
    const sites = [
      { id: 'debtors', name: 'รายการลูกหนี้ Service', icon: 'wallet', folder: 'รายการลูกหนี้ Service' },
      { id: 'holiday', name: 'รายงานทำงานวันหยุด', icon: 'calendar', folder: 'รายงานทำงานวันหยุด' },
      { id: 'trips', name: 'เวรทริปต่างจังหวัด', icon: 'route', folder: 'เวรทริปต่างจังหวัด' },
      { id: 'parts', name: 'Spare Part List', icon: 'package', folder: 'Spare Part List' },
      { id: 'withdrawal', name: 'Spare Parts Stock Withdrawal', icon: 'arrows', folder: 'Spare Parts Stock Withdrawal' }
    ];
    const iconPaths = {
      home: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
      wallet: '<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h.01"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',
      route: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M9 19h6a4 4 0 0 0 0-8H9a3 3 0 0 1 0-6h6"/>',
      package: '<path d="m12 3 9 5-9 5-9-5 9-5ZM3 8v9l9 5 9-5V8M12 13v9"/>',
      arrows: '<path d="m8 4-4 4 4 4M4 8h16M16 20l4-4-4-4M20 16H4"/>',
      arrowUpRight: '<path d="M7 17 17 7M8 7h9v9"/>'
    };
    const iconSvg = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${iconPaths[name]}</svg>`;
    const views = [{ id: 'home', name: 'หน้ารวมระบบงาน', icon: 'home' }];
    for (const site of sites) {
      views.push({ ...site, url: encodeURIComponent(site.folder) + '/index.html' + (site.id === 'withdrawal' ? '' : '?view=1') });
    }
    const app = document.getElementById('app');
    const nav = document.getElementById('nav');
    const cards = document.getElementById('cards');
    const home = document.getElementById('home');
    const viewer = document.getElementById('viewer');
    const pageTitle = document.getElementById('pageTitle');
    const openFull = document.getElementById('openFull');
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const mobileMenu = window.matchMedia('(max-width: 760px)');
    const themeToggle = document.getElementById('themeToggle');
    // Local file pages have opaque origins, so their iframe messages need a wildcard target.
    const viewerMessageTarget = location.protocol === 'file:' ? '*' : location.origin;
    const isViewerOrigin = event => location.protocol === 'file:'
      ? event.origin === 'null' || event.origin === 'file://'
      : event.origin === location.origin;
    function applyTheme(theme) {
      const dark = theme === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      themeToggle.setAttribute('aria-pressed', String(dark));
      document.getElementById('themeToggleLabel').textContent = dark ? 'โหมดมืด' : 'โหมดสว่าง';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#0b1422' : '#e5ffff';
      if (viewer.contentWindow && viewer.getAttribute('src')) viewer.contentWindow.postMessage({ type: 'manager-web-theme', theme: dark ? 'dark' : 'light' }, viewerMessageTarget);
    }
    applyTheme(document.documentElement.dataset.theme);
    themeToggle.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem('manager-web-theme', next); } catch (_) {}
    });
    function syncViewerLayout() {
      if (viewer.contentWindow && viewer.getAttribute('src')) {
        viewer.contentWindow.postMessage({ type: 'manager-web-layout', wide: !mobileMenu.matches && app.classList.contains('sidebar-collapsed') }, viewerMessageTarget);
      }
    }
    viewer.addEventListener('load', () => {
      viewer.contentWindow.postMessage({ type: 'manager-web-theme', theme: document.documentElement.dataset.theme }, viewerMessageTarget);
      syncViewerLayout();
    });
    window.addEventListener('message', event => {
      if (!isViewerOrigin(event) || event.source !== viewer.contentWindow || event.data?.type !== 'manager-web-theme') return;
      applyTheme(event.data.theme);
      try { localStorage.setItem('manager-web-theme', document.documentElement.dataset.theme); } catch (_) {}
    });
    let currentId = '';
    function updateMenuToggle() {
      const expanded = mobileMenu.matches ? app.classList.contains('menu-open') : !app.classList.contains('sidebar-collapsed');
      menuToggle.setAttribute('aria-expanded', String(expanded));
      menuToggle.setAttribute('aria-label', expanded ? 'ปิดเมนู' : 'เปิดเมนู');
      sidebar.inert = !expanded;
      syncViewerLayout();
    }
    function closeMenu() {
      app.classList.remove('menu-open');
      updateMenuToggle();
    }
    function choose(id) {
      const view = views.find(item => item.id === id) || views[0];
      if (location.hash !== '#' + view.id) history.pushState(null, '', '#' + view.id);
      render(view);
    }
    function render(view) {
      closeMenu();
      currentId = view.id;
      const isHome = view.id === 'home';
      pageTitle.textContent = view.name;
      home.hidden = !isHome;
      viewer.hidden = isHome;
      openFull.hidden = isHome;
      if (isHome) {
        viewer.removeAttribute('src');
        openFull.removeAttribute('href');
      } else {
        if (viewer.getAttribute('src') !== view.url) viewer.src = view.url;
        viewer.title = pageTitle.textContent;
        openFull.href = view.url;
      }
      for (const link of nav.querySelectorAll('[data-view]')) {
        if (link.dataset.view === currentId) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      }
    }
    function syncFromHash() {
      const id = decodeURIComponent(location.hash.slice(1));
      render(views.find(view => view.id === id) || views[0]);
    }
    const homeLabel = document.createElement('p');
    homeLabel.className = 'nav-label';
    homeLabel.textContent = 'ภาพรวม';
    nav.append(homeLabel);
    for (const view of views) {
      if (view.id === 'debtors') {
        const label = document.createElement('p');
        label.className = 'nav-label';
        label.style.marginTop = '23px';
        label.textContent = 'ระบบงาน';
        nav.append(label);
      }
      const link = document.createElement('a');
      link.className = 'nav-link' + (view.sub ? ' sub' : '');
      link.href = '#' + view.id;
      link.dataset.view = view.id;
      link.innerHTML = '<span class="icon" aria-hidden="true">' + iconSvg(view.icon) + '</span><span class="label"></span>';
      link.querySelector('.label').textContent = view.name;
      link.addEventListener('click', event => { event.preventDefault(); choose(view.id); });
      nav.append(link);
    }
    for (const site of sites) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.classList.toggle('editable', site.id === 'withdrawal');
      card.innerHTML = '<span class="card-top"><span class="card-icon" aria-hidden="true">' + iconSvg(site.icon) + '</span><span class="card-arrow" aria-hidden="true">' + iconSvg('arrowUpRight') + '</span></span><strong></strong><span class="card-status"></span>';
      card.querySelector('strong').textContent = site.name;
      card.querySelector('.card-status').textContent = site.id === 'withdrawal' ? 'ทำรายการได้' : 'ดูข้อมูล';
      card.addEventListener('click', () => choose(site.id));
      cards.append(card);
    }
    menuToggle.addEventListener('click', () => {
      if (mobileMenu.matches) app.classList.toggle('menu-open');
      else app.classList.toggle('sidebar-collapsed');
      updateMenuToggle();
    });
    mobileMenu.addEventListener('change', () => { app.classList.remove('menu-open'); updateMenuToggle(); });
    document.getElementById('scrim').addEventListener('click', closeMenu);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenu(); });
    window.addEventListener('hashchange', syncFromHash);
    window.addEventListener('popstate', syncFromHash);
    syncFromHash();
  </script>
</body>
</html>
